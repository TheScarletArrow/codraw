# Prometheus of the profile `monitoring` of docker-compose.prod.yml: it reads the metrics of backend and collab in the
# network of the stack, where they are open; the app address does not give them.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:8080"]
  - job_name: collab
    static_configs:
      - targets: ["collab:1234"]
