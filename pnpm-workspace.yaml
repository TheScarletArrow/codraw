packages:
  - frontend
  - collab
  - e2e
  - load

onlyBuiltDependencies:
  - esbuild

# jsPDF needs these only for html() and addSvgAsImage(), which CoDraw does not call.
ignoredOptionalDependencies:
  - canvg
  - core-js
  - dompurify
  - html2canvas

# Hocuspocus makes a scratch document for every awareness message; with a guid of its own the document does not ask the
# system for random numbers 31 times (docs/load-testing.md).
patchedDependencies:
  '@hocuspocus/server@4.7.0': patches/@hocuspocus__server@4.7.0.patch
