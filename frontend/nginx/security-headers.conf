# Included into every location that serves the app: add_header in a location drops the headers of the server block.
# Who may frame a page comes from default.conf.template: any site for the reading of a board, /view/…, nobody else.
# Nothing inline: the build has no inline scripts, and the app and maxGraph set styles through the DOM, which the
# policy allows. data: images are the icons of maxGraph; avatars come from GitHub and Google. 'wasm-unsafe-eval' lets the
# router of edges compile its WebAssembly, which comes from the app like the scripts.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data: blob: https://avatars.githubusercontent.com https://*.googleusercontent.com; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors $frame_ancestors" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options $frame_options always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
