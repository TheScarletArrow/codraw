services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-codraw}
      POSTGRES_USER: ${POSTGRES_USER:-codraw}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codraw}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 images keep data in a versioned subdirectory of /var/lib/postgresql.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The S3-compatible storage of images of boards (docs/adr/0006-image-storage.md); the backend of `./gradlew bootRun`
  # reaches it with the keys of its dev profile.
  s3:
    image: rustfs/rustfs:1.0.1
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-codraw}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-codraw-secret}
    ports:
      - "${S3_PORT:-9000}:9000"
    volumes:
      - s3-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  s3-data:
