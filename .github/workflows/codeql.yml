name: CodeQL

# The static analysis of the code (docs/security.md). Alerts go to «Security → Code scanning» of the repository; the
# weekly run finds what new queries learn about code that did not change.
on:
  # Runs for the branches of Dependabot have a token that cannot upload results; their changes are analysed in main.
  push:
    branches-ignore: ["dependabot/**"]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

jobs:
  analyze:
    name: codeql (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          # The extractor of Kotlin watches the compiler, so the backend is built under it.
          - language: java-kotlin
            build-mode: manual
    steps:
      - uses: actions/checkout@v5
      - if: matrix.build-mode == 'manual'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
          config: |
            paths-ignore:
              - "**/node_modules"
              - "**/dist"
      - if: matrix.build-mode == 'manual'
        # A fresh compilation in the process of Gradle, which then needs a larger heap: neither the build cache nor a
        # daemon of Kotlin compiles out of sight of the extractor.
        run: >-
          ./gradlew --no-daemon --no-build-cache -Dorg.gradle.jvmargs=-Xmx4g
          -Pkotlin.compiler.execution.strategy=in-process testClasses
        working-directory: backend
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
