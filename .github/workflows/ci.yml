name: CI

on:
  push:
  workflow_dispatch:

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
      - run: ./gradlew build

  web:
    name: frontend + collab
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Known high and critical vulnerabilities in the packages of the lockfile (docs/security.md).
      - run: pnpm audit --audit-level high
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: codraw
          POSTGRES_USER: codraw
          POSTGRES_PASSWORD: codraw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codraw -d codraw"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # The storage of images, as in docker-compose.yml; it starts without a command, which services cannot pass.
      s3:
        image: rustfs/rustfs:1.0.1
        env:
          RUSTFS_ACCESS_KEY: codraw
          RUSTFS_SECRET_KEY: codraw-secret
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -fs http://localhost:9000/health"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
      - run: ./gradlew bootJar
        working-directory: backend
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @codraw/collab --filter @codraw/frontend build
      - run: pnpm --filter @codraw/e2e exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  images:
    name: images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      CODRAW_VERSION: ${{ github.sha }}
      # Test secrets of the stack that this job starts.
      POSTGRES_PASSWORD: ci-postgres-password
      CODRAW_S3_SECRET_KEY: ci-s3-secret-key
      CODRAW_INTERNAL_TOKEN: ci-internal-token
      # Backups go to a bucket of the storage of the stack, as to a storage outside the server, encrypted; the rule of
      # retention is short for deploy/backup/check-restore.sh.
      CODRAW_BACKUP_S3_ENDPOINT: http://s3:9000
      CODRAW_BACKUP_S3_BUCKET: codraw-backups
      CODRAW_BACKUP_S3_PREFIX: ci
      CODRAW_BACKUP_S3_ACCESS_KEY: codraw
      CODRAW_BACKUP_S3_SECRET_KEY: ci-s3-secret-key
      CODRAW_BACKUP_ENCRYPTION_PASSWORD: ci-backup-password
      CODRAW_BACKUP_KEEP_DAILY: 3
      CODRAW_BACKUP_KEEP_WEEKLY: 2
      # An OAuth application of GitHub that the stack offers: the browser check reads its callback URL.
      GITHUB_CLIENT_ID: ci-github-client
      GITHUB_CLIENT_SECRET: ci-github-secret
      # Alert channels of the stack for deploy/alertmanager/check-delivery.sh: the chat and the watchdog go to its
      # receiver; Telegram has an invented token and a Bot API on a closed port of the receiver, so that its errors of the
      # network print the address with the token, which must stay out of the log.
      CODRAW_ALERT_CHAT_WEBHOOK_URL: http://alert-sink:8080/chat
      CODRAW_ALERT_WATCHDOG_URL: http://alert-sink:8080/watchdog
      CODRAW_ALERT_TELEGRAM_BOT_TOKEN: 123456789:AAFakeTokenForCi_alerts-check
      CODRAW_ALERT_TELEGRAM_CHAT_ID: "-1001"
      CODRAW_ALERT_TELEGRAM_API_URL: http://alert-sink:9
    steps:
      - uses: actions/checkout@v5
      - name: Name the images
        # Image names must be lower case; the owner of the repository need not be.
        run: echo "CODRAW_IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/codraw-" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - name: Build backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          load: true
          tags: ${{ env.CODRAW_IMAGE_PREFIX }}backend:${{ env.CODRAW_VERSION }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build collab
        uses: docker/build-push-action@v6
        with:
          context: .
          file: collab/Dockerfile
          load: true
          tags: ${{ env.CODRAW_IMAGE_PREFIX }}collab:${{ env.CODRAW_VERSION }}
          cache-from: type=gha,scope=collab
          cache-to: type=gha,mode=max,scope=collab
      - name: Build frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          load: true
          tags: ${{ env.CODRAW_IMAGE_PREFIX }}frontend:${{ env.CODRAW_VERSION }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Build backup
        uses: docker/build-push-action@v6
        with:
          context: deploy/backup
          load: true
          tags: ${{ env.CODRAW_IMAGE_PREFIX }}backup:${{ env.CODRAW_VERSION }}
          cache-from: type=gha,scope=backup
          cache-to: type=gha,mode=max,scope=backup
      # The packages of the system and the dependencies inside the images (docs/security.md): a critical or high
      # vulnerability that has a fixed version fails the job, before the images start or are published.
      - uses: anchore/scan-action/download-grype@v7
        id: grype
      - name: Scan the images for vulnerabilities
        run: |
          failed=
          for service in backend collab frontend backup; do
            "${{ steps.grype.outputs.cmd }}" "docker:${CODRAW_IMAGE_PREFIX}${service}:${CODRAW_VERSION}" --only-fixed -o json \
              > "$RUNNER_TEMP/grype-$service.json"
            found=$(jq -r '.matches[] | select(.vulnerability.severity == "Critical" or .vulnerability.severity == "High")
              | [.vulnerability.severity, .artifact.name, .artifact.version, (.vulnerability.fix.versions | join(" ")),
                 .vulnerability.id, (.artifact.locations[0].path // "")] | @tsv' "$RUNNER_TEMP/grype-$service.json" | sort -u)
            if [ -n "$found" ]; then
              failed="$failed $service"
              echo "::group::$service: fixed critical and high vulnerabilities"
              printf 'severity\tpackage\tversion\tfixed in\tid\tpath\n%s\n' "$found" | column -t -s $'\t'
              echo "::endgroup::"
            fi
          done
          if [ -n "$failed" ]; then echo "::error::Fixed critical or high vulnerabilities in:$failed"; exit 1; fi
      - name: Check the Prometheus and Alertmanager configurations and alert rules
        run: |
          promtool() {
            docker run --rm --entrypoint /bin/promtool -v "$PWD/deploy/prometheus:/etc/prometheus:ro" -w /etc/prometheus \
              prom/prometheus:v3.15.0 "$@"
          }
          promtool check config prometheus.yml
          promtool test rules alerts.test.yml
          # The configuration that deploy/alertmanager/entrypoint.sh builds, checked by amtool; only the -e given count.
          amtool_check() {
            docker run --rm --entrypoint /bin/sh -v "$PWD/deploy/alertmanager:/etc/alertmanager/codraw:ro" "$@" \
              prom/alertmanager:v0.34.1 /etc/alertmanager/codraw/entrypoint.sh check
          }
          amtool_check
          amtool_check -e CODRAW_ALERT_TELEGRAM_BOT_TOKEN=123456789:AAFake -e CODRAW_ALERT_TELEGRAM_CHAT_ID=-1001 \
            -e CODRAW_ALERT_TELEGRAM_API_URL=https://telegram-proxy.example.com \
            -e CODRAW_ALERT_EMAIL_TO=ops@example.com,oncall@example.com -e CODRAW_SMTP_HOST=smtp.example.com \
            -e CODRAW_MAIL_FROM=codraw@example.com -e CODRAW_SMTP_USERNAME=codraw -e CODRAW_SMTP_PASSWORD=secret \
            -e CODRAW_ALERT_CHAT_WEBHOOK_URL=https://chat.example.com/hooks/1 \
            -e CODRAW_ALERT_WATCHDOG_URL=https://watchdog.example.com/ping/1
          if amtool_check -e CODRAW_ALERT_EMAIL_TO=ops@example.com 2> "$RUNNER_TEMP/amtool.log"; then
            echo "::error::a channel set in part passed the check"
            exit 1
          fi
          grep -F "CODRAW_SMTP_HOST is not set" "$RUNNER_TEMP/amtool.log"
      - name: Start the stack from the images, with monitoring
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$RUNNER_TEMP/signing-key.pem"
          { echo 'CODRAW_COLLAB_TOKEN_SIGNING_KEY<<KEY'; cat "$RUNNER_TEMP/signing-key.pem"; echo KEY; } >> "$GITHUB_ENV"
          export CODRAW_COLLAB_TOKEN_SIGNING_KEY="$(cat "$RUNNER_TEMP/signing-key.pem")"
          docker compose -f docker-compose.prod.yml --profile monitoring up -d --no-build --wait --wait-timeout 300
      - name: Check that Prometheus reads backend, collab and backup
        run: |
          for attempt in $(seq 1 30); do
            up=$(curl -s http://127.0.0.1:9090/api/v1/targets | jq '[.data.activeTargets[] | select(.health == "up")] | length')
            if [ "$up" = 3 ]; then exit 0; fi
            sleep 2
          done
          curl -s http://127.0.0.1:9090/api/v1/targets
          exit 1
      - name: Check that alerts reach a receiver
        run: deploy/alertmanager/check-delivery.sh
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @codraw/e2e exec playwright install --with-deps chromium
      - name: Check the stack in a browser
        run: pnpm --filter @codraw/e2e test:stack
        env:
          STACK_URL: http://localhost:8080
      - name: Check backups and the restore of a backup
        run: deploy/backup/check-restore.sh
      - name: Check the restored stack in a browser
        run: pnpm --filter @codraw/e2e test:stack
        env:
          STACK_URL: http://localhost:8080
      - if: failure()
        run: docker compose -f docker-compose.prod.yml --profile monitoring logs --no-color
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-stack
          path: e2e/playwright-report-stack
          retention-days: 7
      # Under the tag of the commit only: `latest` moves to them once the other checks of the commit pass too.
      - name: Publish the images
        if: github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for service in backend collab frontend backup; do
            docker push "${CODRAW_IMAGE_PREFIX}${service}:$CODRAW_VERSION"
          done

  specs:
    name: openspec
    runs-on: ubuntu-latest
    env:
      OPENSPEC_TELEMETRY: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npx -y @fission-ai/openspec@1.14.0 validate --all --strict --no-interactive

  release:
    name: release
    if: github.ref == 'refs/heads/main'
    needs: [backend, web, e2e, images, specs]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Tag the images of the commit as latest
        # The same images that the stack check ran, without building them again.
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          prefix="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/codraw-"
          for service in backend collab frontend backup; do
            docker buildx imagetools create --tag "${prefix}${service}:latest" "${prefix}${service}:${GITHUB_SHA}"
          done
