# CoDraw on a server: the app with its API and sync on one port, behind a proxy that terminates TLS.
# Variables: .env.prod.example; the whole guide: docs/deploy.md.
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --wait
# With Prometheus, which reads the metrics of backend and collab (deploy/prometheus next to this file):
#   docker compose -f docker-compose.prod.yml --env-file .env.prod --profile monitoring up -d --wait
# Its own project name: the containers and the volume do not mix with those of docker-compose.yml for development.
name: codraw-prod

x-restart: &restart
  restart: unless-stopped

services:
  postgres:
    <<: *restart
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-codraw}
      POSTGRES_USER: ${POSTGRES_USER:-codraw}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD, the password of the database}
    volumes:
      # PostgreSQL 18 images keep data in a versioned subdirectory of /var/lib/postgresql.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    <<: *restart
    image: ${CODRAW_IMAGE_PREFIX:-ghcr.io/thescarletarrow/codraw-}backend:${CODRAW_VERSION:-latest}
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-codraw}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-codraw}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      CODRAW_INTERNAL_TOKEN: ${CODRAW_INTERNAL_TOKEN:?set CODRAW_INTERNAL_TOKEN, the secret of the internal API shared by backend and collab}
      CODRAW_COLLAB_TOKEN_SIGNING_KEY: ${CODRAW_COLLAB_TOKEN_SIGNING_KEY:?set CODRAW_COLLAB_TOKEN_SIGNING_KEY, the RSA key that signs sync tokens}
      CODRAW_COLLAB_TOKEN_PREVIOUS_SIGNING_KEY: ${CODRAW_COLLAB_TOKEN_PREVIOUS_SIGNING_KEY:-}
      # The backend needs some value to start; until the OAuth applications are set up only the guest sign-in works.
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-not-configured}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-not-configured}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-not-configured}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-not-configured}
      CODRAW_GUESTS_BOARD_RETENTION: ${CODRAW_GUESTS_BOARD_RETENTION:-30d}
      # Who provides the service: the privacy policy and the terms of use name them.
      CODRAW_LEGAL_OPERATOR: ${CODRAW_LEGAL_OPERATOR:-}
      CODRAW_LEGAL_CONTACT_EMAIL: ${CODRAW_LEGAL_CONTACT_EMAIL:-}
      CODRAW_LIMITS_BOARDS_PER_USER: ${CODRAW_LIMITS_BOARDS_PER_USER:-100}
      CODRAW_LIMITS_GUESTS_PER_ADDRESS_PER_HOUR: ${CODRAW_LIMITS_GUESTS_PER_ADDRESS_PER_HOUR:-20}
      CODRAW_LIMITS_CLIENT_ERRORS_PER_ADDRESS_PER_MINUTE: ${CODRAW_LIMITS_CLIENT_ERRORS_PER_ADDRESS_PER_MINUTE:-30}
      CODRAW_LIMITS_COMMENTS_PER_BOARD: ${CODRAW_LIMITS_COMMENTS_PER_BOARD:-5000}
      CODRAW_LIMITS_MEMBERS_PER_BOARD: ${CODRAW_LIMITS_MEMBERS_PER_BOARD:-100}
      CODRAW_LIMITS_INVITES_PER_BOARD: ${CODRAW_LIMITS_INVITES_PER_BOARD:-20}
      CODRAW_LIMITS_ACCESS_REQUESTS_PER_BOARD: ${CODRAW_LIMITS_ACCESS_REQUESTS_PER_BOARD:-50}
      CODRAW_LIMITS_NOTIFICATIONS_PER_USER: ${CODRAW_LIMITS_NOTIFICATIONS_PER_USER:-200}
      CODRAW_LIMITS_PROPOSALS_PER_BOARD: ${CODRAW_LIMITS_PROPOSALS_PER_BOARD:-20}
      CODRAW_LIMITS_PROPOSALS_PER_AUTHOR: ${CODRAW_LIMITS_PROPOSALS_PER_AUTHOR:-3}
      CODRAW_LIMITS_CLOSED_PROPOSALS_PER_BOARD: ${CODRAW_LIMITS_CLOSED_PROPOSALS_PER_BOARD:-20}
      CODRAW_NOTIFICATIONS_RETENTION: ${CODRAW_NOTIFICATIONS_RETENTION:-90d}
      CODRAW_NOTIFICATIONS_REVIEW_REQUEST_INTERVAL: ${CODRAW_NOTIFICATIONS_REVIEW_REQUEST_INTERVAL:-10m}
      CODRAW_LIMITS_REVIEW_REQUESTS_PER_HOUR: ${CODRAW_LIMITS_REVIEW_REQUESTS_PER_HOUR:-30}
      CODRAW_LIMITS_EMBED_SIZE: ${CODRAW_LIMITS_EMBED_SIZE:-2MB}
      # Above the limit of collab, so that a document that collab accepted is always stored; nginx takes up to 32 MB.
      CODRAW_LIMITS_DOCUMENT_SIZE: ${CODRAW_LIMITS_DOCUMENT_SIZE:-32MB}
      CODRAW_LIMITS_VERSIONS_SIZE_PER_BOARD: ${CODRAW_LIMITS_VERSIONS_SIZE_PER_BOARD:-64MB}
      # One line of JSON (ECS) per event; without it the log is plain text.
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
    depends_on:
      postgres:
        condition: service_healthy

  collab:
    <<: *restart
    image: ${CODRAW_IMAGE_PREFIX:-ghcr.io/thescarletarrow/codraw-}collab:${CODRAW_VERSION:-latest}
    build:
      context: .
      dockerfile: collab/Dockerfile
    environment:
      BACKEND_URL: http://backend:8080
      BACKEND_JWKS_URL: http://backend:8080/.well-known/jwks.json
      CODRAW_INTERNAL_TOKEN: ${CODRAW_INTERNAL_TOKEN}
      DOCUMENT_SIZE_LIMIT_BYTES: ${DOCUMENT_SIZE_LIMIT_BYTES:-16777216}
      # One line of JSON (ECS) per event, like the backend; "text" gives plain text.
      LOG_FORMAT: json
    depends_on:
      # Collab verifies sync tokens with the keys of the backend.
      backend:
        condition: service_healthy

  frontend:
    <<: *restart
    image: ${CODRAW_IMAGE_PREFIX:-ghcr.io/thescarletarrow/codraw-}frontend:${CODRAW_VERSION:-latest}
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      # The only published port: the app, the API and sync.
      - "${CODRAW_HTTP_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
      collab:
        condition: service_healthy

  prometheus:
    <<: *restart
    image: prom/prometheus:v3.15.0
    # Only with --profile monitoring.
    profiles: [monitoring]
    volumes:
      - ./deploy/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      # On the server itself only: Prometheus has no sign-in. Reach it through an SSH tunnel or a proxy with a sign-in.
      - "127.0.0.1:${CODRAW_PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - backend
      - collab

volumes:
  postgres-data:
  prometheus-data:
