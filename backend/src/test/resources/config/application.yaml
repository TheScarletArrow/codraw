# Test-only additions to the application configuration. Tests never reach GitHub, Google, Яндекс ID or VK ID: the last
# two answer from FakeSignInProviders.
spring:
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: test-github-client
            client-secret: test-github-secret
          google:
            client-id: test-google-client
            client-secret: test-google-secret
          yandex:
            client-id: test-yandex-client
            client-secret: test-yandex-secret
          vk:
            client-id: test-vk-client

codraw:
  guests:
    # Tests run the cleanup themselves.
    cleanup-cron: "-"
  notifications:
    # Tests run the cleanup themselves.
    cleanup-cron: "-"
    app-url: https://codraw.example.com
    email:
      from: CoDraw <codraw@example.com>
    webhook:
      # Webhooks of the tests listen on this machine.
      allowed-hosts: hooks.slack.com,localhost
      allow-http: true
    delivery:
      # Tests send the queue themselves.
      cron: "-"
  images:
    # Tests run the cleanup themselves.
    cleanup-cron: "-"
