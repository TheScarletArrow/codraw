# Defaults for local development against `docker compose up postgres`.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/codraw
    username: codraw
    password: codraw
  # Sign-in works once the OAuth applications are set up, see README.md; until then the backend starts without them.
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID:not-configured}
            client-secret: ${GITHUB_CLIENT_SECRET:not-configured}
          google:
            client-id: ${GOOGLE_CLIENT_ID:not-configured}
            client-secret: ${GOOGLE_CLIENT_SECRET:not-configured}

codraw:
  internal-token: dev-internal-token
  # Letters and messages of chats link to the dev server of the frontend. Letters need an SMTP server too, e.g. Mailpit:
  # SPRING_MAIL_HOST=localhost SPRING_MAIL_PORT=1025 CODRAW_NOTIFICATIONS_EMAIL_FROM="CoDraw <codraw@localhost>".
  notifications:
    app-url: http://localhost:5173
  # The storage of images of `docker compose up s3`.
  images:
    s3:
      endpoint: http://localhost:9000
      access-key: codraw
      secret-key: codraw-secret
