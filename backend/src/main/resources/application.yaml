spring:
  application:
    name: codraw-backend
  # Requests run on virtual threads: one that waits on the database no longer holds a thread of a bounded pool, so the
  # limit of concurrent requests is the pool of database connections.
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true
  security:
    oauth2:
      client:
        # A provider whose client id is `not-configured` is off: the login page does not offer it (docs/deploy.md).
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID:not-configured}
            client-secret: ${GITHUB_CLIENT_SECRET:not-configured}
            redirect-uri: "{baseUrl}/api/login/oauth2/code/{registrationId}"
          google:
            client-id: ${GOOGLE_CLIENT_ID:not-configured}
            client-secret: ${GOOGLE_CLIENT_SECRET:not-configured}
            # Without `openid` Google is used as a plain OAuth2 provider, like GitHub.
            scope: profile
            redirect-uri: "{baseUrl}/api/login/oauth2/code/{registrationId}"
  # The SMTP server of letters about notifications (spring.mail.host, port, username, password): the environment of the
  # deployment sets it, see docs/deploy.md. Without a host letters are off.
  mail:
    default-encoding: UTF-8
    properties:
      # A mail server that does not answer holds up only its own letter, never long.
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
      # Encrypts the connection where the server offers it, e.g. on port 587.
      mail.smtp.starttls.enable: true

server:
  port: ${PORT:8080}
  # Behind nginx and a TLS proxy: the scheme and the host of the user come from X-Forwarded-* of trusted proxies
  # (internal addresses), so OAuth callback URLs use https and session cookies are Secure.
  forward-headers-strategy: native
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        # Not reachable through the app address: nginx proxies only /api/; Prometheus reads metrics in the stack network.
        include: health,prometheus
  metrics:
    tags:
      application: codraw-backend
  endpoint:
    health:
      probes:
        enabled: true
  health:
    mail:
      # A mail server that is down holds letters in the queue; the backend itself stays healthy.
      enabled: false

codraw:
  # Providers of OpenID Connect by their ids (codraw.auth.oidc.<id>.issuer-uri, client-id, client-secret, name, scopes,
  # allowed-email-domains, allowed-groups, groups-claim, logout; CODRAW_AUTH_OIDC_<ID>_*). See docs/deploy.md.
  auth:
    oidc: {}
  guests:
    # «Продолжить без входа» (CODRAW_GUESTS_ENABLED); a closed installation turns it off.
    enabled: true
    # A board of a guest whose session has expired is deleted once nobody worked on it for this long.
    board-retention: 30d
    # Every hour; "-" turns the cleanup off.
    cleanup-cron: "0 23 * * * *"
  notifications:
    # A notification is deleted once it is this old, read or not.
    retention: 90d
    # The owner of a board hears of a request to review an element at most once in this time.
    review-request-interval: 10m
    # Every hour; "-" turns the cleanup off.
    cleanup-cron: "0 41 * * * *"
    # The address of the app that letters and messages in chats link to, e.g. https://codraw.example.com
    # (CODRAW_NOTIFICATIONS_APP_URL); empty turns both off. See docs/deploy.md.
    app-url: ""
    email:
      # The sender of letters, e.g. "CoDraw <codraw@example.com>"; empty turns letters off.
      from: ""
      # How long the link of a letter that confirms an address works.
      confirmation-ttl: 1d
    webhook:
      # Host names of incoming webhooks of chats that users may enter, comma-separated, e.g.
      # "hooks.slack.com,chat.example.com"; empty turns chats off.
      allowed-hosts: hooks.slack.com
    delivery:
      # A message waits this long before its first attempt: a notification read or undone meanwhile is not sent.
      delay: 1m
      max-attempts: 5
      # Every 15 seconds; "-" turns sending off.
      cron: "*/15 * * * * *"
  images:
    # Deletes the images of deleted boards from the storage every hour; "-" turns the cleanup off.
    cleanup-cron: "0 53 * * * *"
    # The S3-compatible storage of images (codraw.images.s3.endpoint, region, bucket, access-key, secret-key): the
    # environment of the deployment sets it, see docs/deploy.md.
  issues:
    github:
      # The REST API of GitHub through which users link issues to elements and threads (CODRAW_ISSUES_GITHUB_API_URL),
      # e.g. https://github.example.com/api/v3 of GitHub Enterprise Server; empty turns issues off. See docs/deploy.md
      # and docs/adr/0009-issue-tracker.md.
      api-url: https://api.github.com
      # The secret of the webhook of issues that brings their changes at once (CODRAW_ISSUES_GITHUB_WEBHOOK_SECRET);
      # empty turns the webhook off.
      webhook-secret: ""
  schema-import:
    # Host names, addresses and networks (CIDR) of PostgreSQL databases whose schemas users may read through the
    # backend, comma-separated, e.g. "db.internal,10.20.0.0/16" (CODRAW_SCHEMA_IMPORT_ALLOWED_HOSTS). Empty turns
    # «Подключиться к базе…» off. See docs/deploy.md and docs/adr/0007-live-schema-import.md.
    allowed-hosts: ""
