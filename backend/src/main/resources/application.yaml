spring:
  application:
    name: codraw-backend
  mvc:
    problemdetails:
      enabled: true
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID:}
            client-secret: ${GITHUB_CLIENT_SECRET:}
            redirect-uri: "{baseUrl}/api/login/oauth2/code/{registrationId}"
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            # Without `openid` Google is used as a plain OAuth2 provider, like GitHub.
            scope: profile
            redirect-uri: "{baseUrl}/api/login/oauth2/code/{registrationId}"

server:
  port: ${PORT:8080}
  # Behind nginx and a TLS proxy: the scheme and the host of the user come from X-Forwarded-* of trusted proxies
  # (internal addresses), so OAuth callback URLs use https and session cookies are Secure.
  forward-headers-strategy: native
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
